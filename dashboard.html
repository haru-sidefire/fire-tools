/* ============================
   CSS — レイアウト・テーマ
   ============================ */
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --card-hover: #1a2745;
  --accent: #e94560;
  --accent2: #0f3460;
  --text: #eee;
  --text-sub: #aab;
  --green: #4caf50;
  --yellow: #ffc107;
  --blue: #4a90d9;
  --orange: #ff9800;
  --border: #2a2a4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, var(--accent2), #0a1628);
  padding: 20px 24px;
  border-bottom: 2px solid var(--accent);
}
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { color: var(--accent); font-size: 15px; margin-top: 2px; }
.header .update-info { color: var(--text-sub); font-size: 13px; margin-top: 4px; }

/* タブ */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab {
  padding: 14px 24px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-sub);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
}
.tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* パネル */
.panel { display: none; padding: 24px; }
.panel.active { display: block; }

/* カード共通 */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: background .2s;
}
.card:hover { background: var(--card-hover); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.card-title { font-weight: 700; font-size: 16px; }

/* バッジ */
.badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}
.badge-published { background: var(--green); color: #fff; }
.badge-draft { background: var(--yellow); color: #333; }
.badge-planned { background: var(--blue); color: #fff; }
.badge-idea { background: var(--orange); color: #fff; }
.badge-posted { background: var(--green); color: #fff; }
.badge-scheduled { background: var(--blue); color: #fff; }

/* タグ */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  background: rgba(255,255,255,.08);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-sub);
}

/* カレンダー */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 12px;
}
.cal-header { font-size: 13px; text-align: center; color: var(--text-sub); font-weight: 600; padding: 6px 0; }
.cal-day {
  min-height: 68px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 13px;
}
.cal-day.today { border-color: var(--accent); background: rgba(233,69,96,.1); }
.cal-day .day-num { font-weight: 700; margin-bottom: 2px; }
.cal-day .event {
  font-size: 12px;
  padding: 1px 4px;
  border-radius: 3px;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-day .event.note-ev { background: rgba(74,144,217,.3); color: #8bb8ea; }
.cal-day .event.x-ev { background: rgba(233,69,96,.3); color: #f0a0b0; }
.cal-empty { min-height: 68px; }

/* プロフィール */
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.stat-label { font-size: 13px; color: var(--text-sub); }
.stat-value { font-size: 20px; font-weight: 700; }

/* note本文プレビュー */
.article-body { font-size: 15px; color: var(--text-sub); margin-top: 6px; line-height: 1.7; }
.copy-btn {
  background: var(--accent2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  margin-top: 8px;
  transition: background .2s;
}
.copy-btn:hover { background: var(--accent); }
.article-link-btn {
  display: inline-block;
  background: var(--accent2);
  color: var(--text);
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  border: 1px solid var(--border);
  transition: background .2s;
}
.article-link-btn:hover { background: var(--accent); }
.toggle-btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  margin-top: 8px;
  transition: all .2s;
}
.toggle-btn:hover { background: var(--accent2); }
.toggle-btn.posted { background: rgba(76,175,80,.15); border-color: #4caf50; color: #a5d6a7; font-weight: 700; }
.toggle-btn.posted:hover { background: rgba(76,175,80,.25); }
.cal-day .event.x-ev.posted { opacity: .4; text-decoration: line-through; }

/* 「コピーしてXを開く」メインボタン */
.copy-go-btn {
  background: #1da1f2;
  color: #fff;
  border: 1px solid #1da1f2;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  margin-top: 8px;
  transition: all .2s;
}
.copy-go-btn:hover { background: #1a91da; }

/* リセットボタン */
.reset-btn {
  background: transparent;
  color: var(--text-sub);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all .2s;
}
.reset-btn:hover { background: var(--accent2); color: var(--text); }

/* 手順ガイド */
.workflow-guide {
  background: rgba(29,161,242,.08);
  border: 1px solid rgba(29,161,242,.3);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.workflow-title {
  font-size: 15px;
  font-weight: 700;
  color: #8ec4f2;
  margin-bottom: 12px;
}
.workflow-steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.wf-step {
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.wf-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #1da1f2;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.workflow-note {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);

/* セクションヘッダー */
.section-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);

/* 月ナビ */
.cal-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 8px;

.cal-nav button {
  background: var(--accent2);
  color: var(--text);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
}
.cal-nav button:hover { background: var(--accent); }
.cal-nav .cal-month-label { font-size: 18px; font-weight: 700; }

@media (max-width: 600px) {
  .panel { padding: 12px; }
  .cal-day { min-height: 44px; padding: 2px 3px; }
  .cal-day .event { font-size: 9px; }
}

// ---- ユーティリティ ----
function fmt(dateStr) {
  if (!dateStr) return "未定";
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function statusBadge(s) {
  const m = { published: "公開済み", draft: "下書き", planned: "予定", idea: "アイデア", posted: "投稿済み", scheduled: "予約済み" };
  return `<span class="badge badge-${s}">${m[s]||s}</span>`;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
// エスケープ済みのHTMLの中からURLを検出してアンカーに変換
function linkify(html) {
  return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#4a90d9;text-decoration:underline;word-break:break-all;">$1</a>');
}

// ---- X投稿ステータスの永続化（localStorage） ----
// ユーザーがワンクリックで「投稿済み」に切り替えた結果をブラウザに保存。
// 次回リロードしても状態が保持される。Claudeを呼ばずに自分で更新できる仕組み。
const X_POSTS_OVERRIDES_KEY = 'haruDashboard_xPostsOverrides_v1';
function loadXPostsOverrides() {
  try { return JSON.parse(localStorage.getItem(X_POSTS_OVERRIDES_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveXPostsOverrides(obj) {
  try { localStorage.setItem(X_POSTS_OVERRIDES_KEY, JSON.stringify(obj)); } catch(e) {}
}
function applyXPostsOverrides() {
  const overrides = loadXPostsOverrides();
  D.xPosts.forEach(p => {
    if (overrides[p.id] !== undefined) p.status = overrides[p.id];
  });
}

// 「投稿済みにする」を押した実時刻を記録（ソート用）
const X_POSTED_AT_KEY = 'haruDashboard_xPostedAt_v1';
function savePostedAt(id) {
  try {
    const all = JSON.parse(localStorage.getItem(X_POSTED_AT_KEY) || '{}');
    all[id] = new Date().toISOString();
    localStorage.setItem(X_POSTED_AT_KEY, JSON.stringify(all));
  } catch(e) {}
}
function applyPostedAt() {
  try {
    const pts = JSON.parse(localStorage.getItem(X_POSTED_AT_KEY) || '{}');
    D.xPosts.forEach(p => { if (pts[p.id]) p.postedAt = pts[p.id]; });
  } catch(e) {}
}
function toggleXPostStatus(id) {
  const post = D.xPosts.find(p => p.id === id);
  if (!post) return;
  const newStatus = post.status === 'posted' ? 'scheduled' : 'posted';
  post.status = newStatus;
  const overrides = loadXPostsOverrides();
  overrides[id] = newStatus;
  saveXPostsOverrides(overrides);

  // 投稿済みにした実時刻を記録（並び順に使用）
  if (newStatus === 'posted') savePostedAt(id);

  // 投稿済みにした瞬間にクリップボードへコピー

    const today = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD

    const logEntry = `${today} ${label}`;
    copyTextCompat(logEntry)
      .then(() => showToast('📋 コピーしました！メモアプリを開いてペーストしてください\n' + logEntry))

  }

  renderXPosts();
  renderCalendar();
}

// http環境でも動くコピー（navigator.clipboardはhttps/localhost限定のため）
function copyTextCompat(text) {
  return new Promise((resolve, reject) => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(resolve).catch(() => fallbackCopy(text, resolve, reject));
    } else {
      fallbackCopy(text, resolve, reject);
    }
  });
}
function fallbackCopy(text, resolve, reject) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.contentEditable = true;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '1px';
    ta.style.height = '1px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    if (ta.setSelectionRange) ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('copy failed'));
  } catch (e) { reject(e); }
}

function showToast(msg) {
  let el = document.getElementById('x-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'x-toast';
    el.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:14px 20px;border-radius:12px;font-size:14px;z-index:9999;max-width:88vw;text-align:center;white-space:pre-line;box-shadow:0 4px 20px rgba(0,0,0,.4);border:1px solid #444;transition:opacity .4s;line-height:1.6;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 4000);
}

function getPostLabel(p) {
  const linked = p.linkedArticle ? D.articles.find(a => a.id === p.linkedArticle) : null;
  if (linked) {
    const t = linked.title;
    return (t.length > 18 ? t.substring(0, 18) + '…' : t) + ' 告知';
  }
  // テキスト1行目から絵文字・ハッシュタグ・URLを除去して短縮
  const line = p.text.split('\n')
    .map(l => l.replace(/[\u{1F4DD}\u{1F4D8}\u{1F4D5}\u{1F514}\u{1F331}\u{1F4F1}\u{1FA99}\u{1F4AE}\u{1F4AE}\u{2705}\u{1F4E5}]/gu, '')
               .replace(/#\S+/g, '').replace(/【.*?】/g, '').replace(/https?:\/\/\S+/g, '').trim())
    .find(l => l.length > 2) || p.text.substring(0, 15);
  return line.length > 20 ? line.substring(0, 20) + '…' : line;
}

}

// ---- カレンダーパネル ----
let calYear, calMonth;
function initCal() {
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  renderCalendar();
}
function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}
function renderCalendar() {
  const el = document.getElementById('panel-cal');
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const mm = String(calMonth+1).padStart(2,'0');
  const ym = `${calYear}-${mm}`;

  // イベント取得
  const events = {};
  D.articles.forEach(a => {
    if (a.date && a.date.startsWith(ym)) {
      const day = parseInt(a.date.split('-')[2]);
      if (!events[day]) events[day] = [];
      events[day].push({ type: 'note', label: `📝${a.title.substring(0,8)}`, title: a.title });
    }
  });
  D.xPosts.forEach(p => {
    if (p.date && p.date.startsWith(ym)) {
      const day = parseInt(p.date.split('-')[2]);
      if (!events[day]) events[day] = [];
      events[day].push({ type: 'x', label: '𝕏', title: p.text.split('\n')[0].substring(0,20), posted: p.status === 'posted' });
    }
  });

  let html = `
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">◀ 前月</button>
      <span class="cal-month-label">${calYear}年 ${calMonth+1}月</span>
      <button onclick="changeMonth(1)">翌月 ▶</button>
    </div>
    <div class="cal-grid">
      <div class="cal-header">日</div><div class="cal-header">月</div><div class="cal-header">火</div>
      <div class="cal-header">水</div><div class="cal-header">木</div><div class="cal-header">金</div><div class="cal-header">土</div>`;

  // 空セル
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
    html += `<div class="cal-day${isToday ? ' today' : ''}">`;
    html += `<div class="day-num">${d}</div>`;
    if (events[d]) {
      events[d].forEach(ev => {
        const evClass = ev.type === 'note' ? 'note-ev' : ('x-ev' + (ev.posted ? ' posted' : ''));
        html += `<div class="event ${evClass}" title="${ev.title}${ev.posted ? ' (投稿済み)' : ''}">${ev.label}</div>`;
      });
    }
    html += `</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

        <div><div class="stat-value">${D.articles.filter(a=>a.status==='draft' || a.status==='planned').length}</div><div class="stat-label">下書き</div></div>
        <div><div class="stat-value">${(D.ideas||[]).length + (D.kindleIdeas||[]).length}</div><div class="stat-label">アイデア</div></div>
        <div><div class="stat-value">${D.xPosts.filter(p=>p.status==='posted').length}</div><div class="stat-label">X投稿済み</div></div>
        <div><div class="stat-value">${D.xPosts.filter(p=>p.status==='scheduled').length}</div><div class="stat-label">X予約</div></div>
        <div><div class="stat-value">${(D.kindleBooks||[]).filter(b=>b.status==='published').length}</div><div class="stat-label">Kindle出版済み</div></div>
        <div><div class="stat-value">${(D.kindleBooks||[]).filter(b=>b.status==='draft').length}</div><div class="stat-label">Kindle執筆中</div></div>
      </div>
    </div>`;
}

// ---- Kindle本パネル ----
function renderKindle() {
  const el = document.getElementById('panel-kindle');
  if (!el) return;
  const books = D.kindleBooks || [];
  const ideas = D.kindleIdeas || [];
  if (books.length === 0 && ideas.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">Kindle本はまだ登録されていません</div>';
    return;
  }
  let html = `<div class="section-title">📚 Kindle本（${books.length}冊）</div>`;
  html += books.map(b => {
    const tagsHtml = (b.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    return `
      <div class="article-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
              ${statusBadge(b.status)}
              <span style="font-size:13px;color:var(--muted);">${b.publishDate}</span>
              ${b.asin ? `<span style="font-size:12px;color:var(--muted);font-family:monospace;">ASIN:${b.asin}</span>` : ''}
              <span style="font-size:13px;color:var(--accent);font-weight:bold;">${b.price}</span>
            </div>
            <div style="font-weight:bold;font-size:15px;margin-bottom:6px;">📕 ${escHtml(b.title)}</div>
            <div style="font-size:13px;color:var(--text);line-height:1.7;margin-bottom:8px;">${escHtml(b.summary)}</div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">📄 ${escHtml(b.pages)}</div>
            <div style="margin-bottom:8px;">${tagsHtml}</div>
            ${b.affiliateUrl ? `<a href="${b.affiliateUrl}" target="_blank" rel="noopener" class="article-link-btn" style="background:#ff9900;border-color:#ff9900;color:#fff;">📕 Amazonで見る</a>` : '<span style="font-size:13px;color:var(--yellow);">⏳ 出版準備中</span>'}
          </div>
        </div>
      </div>`;
  }).join('');

  if (ideas.length > 0) {
    html += `<div class="section-title" style="margin-top:24px">💡 Kindleアイデア（${ideas.length}件）</div>`;
    html += ideas.map(b => `
      <div class="card">
        <div class="card-header">
          <span class="card-title">💡 ${escHtml(b.title)}</span>
          ${statusBadge('idea')}
        </div>
        <div style="font-size:14px;color:var(--text-sub);margin-top:6px;">${escHtml(b.summary)}</div>
        <div class="tags">${(b.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>`).join('');
  }
  el.innerHTML = html;
}

// ---- タブ切替 ----
function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tabName));
}

// ---- 初期化 ----
document.addEventListener('DOMContentLoaded', () => {
  applyXPostsOverrides();
  applyPostedAt();
  renderArticles();
  renderXPosts();
  renderKindle();
  initCal();
  renderProfile();
  // ヘッダー
  document.getElementById('header-info').innerHTML = `
    <h1>CONTENT DASHBOARD</h1>
    <div class="sub">${D.profile.handle}</div>
    <div class="update-info">最終更新: ${D.lastUpdated}</div>`;
});
</script>

<!-- ======= HTML構造 ======= -->
<div class="header" id="header-info"></div>

<div class="tabs">
  <div class="tab active" data-tab="cal" onclick="switchTab('cal')">📅 カレンダー</div>
  <div class="tab" data-tab="note" onclick="switchTab('note')">📰 note</div>
  <div class="tab" data-tab="x" onclick="switchTab('x')">𝕏 X投稿</div>
  <div class="tab" data-tab="kindle" onclick="switchTab('kindle')">📚 Kindle本</div>
  <div class="tab" data-tab="profile" onclick="switchTab('profile')">👤 プロフィール</div>
</div>

<div id="panel-cal" class="panel active"></div>
<div id="panel-note" class="panel"></div>
<div id="panel-x" class="panel"></div>
<div id="panel-kindle" class="panel"></div>
<div id="panel-profile" class="panel"></div>

</body>
</html>
